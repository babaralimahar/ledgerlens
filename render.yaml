# Render Blueprint: New -> Blueprint -> pick this repo. Secrets are entered in the dashboard
# (sync: false), never committed. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: ledgerlens
    runtime: docker
    plan: free
    region: singapore  # same region as the Neon database (ap-southeast-1)
    healthCheckPath: /healthz
    # Free plan has no pre-deploy hook, so migrate + seed (both idempotent) run at start.
    dockerCommand: sh /app/start.sh
    envVars:
      - key: ENV
        value: prod
      - key: WORKER_MODE
        value: embedded
      - key: DATABASE_URL
        sync: false  # Neon *direct* connection string (not the -pooler host)
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      # The demo data is synthetic and dated relative to 2026-11-02.
      - key: BUSINESS_DATE
        value: "2026-11-02"
      - key: UPLOAD_RATE_PER_MINUTE
        value: "10"
